version: '3.8'

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: recon_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  bff:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: uvicorn services.bff.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      - PYTHONPATH=/app
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/recon_dev
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      - postgres
      - redis
    volumes:
      - ./backend:/app

  ingestion:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: uvicorn services.ingestion.main:app --host 0.0.0.0 --port 8001
    ports:
      - "8001:8001"
    environment:
      - PYTHONPATH=/app
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/recon_dev
      - GCP_PROJECT_ID=${GCP_PROJECT_ID:-recon-dev}
      - GCP_CLIENT_EMAIL=${GCP_CLIENT_EMAIL:-}
      - GCP_PRIVATE_KEY=${GCP_PRIVATE_KEY:-}
      - GCP_PRIVATE_KEY_ID=${GCP_PRIVATE_KEY_ID:-}
      - GCP_CLIENT_ID=${GCP_CLIENT_ID:-}
      - GCP_CLIENT_X509_CERT_URL=${GCP_CLIENT_X509_CERT_URL:-}
    depends_on:
      - postgres
    volumes:
      - ./backend:/app

  reconciliation:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: uvicorn services.reconciliation.main:app --host 0.0.0.0 --port 8002
    ports:
      - "8002:8002"
    environment:
      - PYTHONPATH=/app
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/recon_dev
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - GCP_PROJECT_ID=${GCP_PROJECT_ID:-recon-dev}
      - GCP_CLIENT_EMAIL=${GCP_CLIENT_EMAIL:-}
      - GCP_PRIVATE_KEY=${GCP_PRIVATE_KEY:-}
      - GCP_PRIVATE_KEY_ID=${GCP_PRIVATE_KEY_ID:-}
      - GCP_CLIENT_ID=${GCP_CLIENT_ID:-}
      - GCP_CLIENT_X509_CERT_URL=${GCP_CLIENT_X509_CERT_URL:-}
    depends_on:
      - postgres
      - redis
    volumes:
      - ./backend:/app

  workflow:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: uvicorn services.workflow.main:app --host 0.0.0.0 --port 8003
    ports:
      - "8003:8003"
    environment:
      - PYTHONPATH=/app
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/recon_dev
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - GCP_PROJECT_ID=${GCP_PROJECT_ID:-recon-dev}
      - GCP_CLIENT_EMAIL=${GCP_CLIENT_EMAIL:-}
      - GCP_PRIVATE_KEY=${GCP_PRIVATE_KEY:-}
      - GCP_PRIVATE_KEY_ID=${GCP_PRIVATE_KEY_ID:-}
      - GCP_CLIENT_ID=${GCP_CLIENT_ID:-}
      - GCP_CLIENT_X509_CERT_URL=${GCP_CLIENT_X509_CERT_URL:-}
    depends_on:
      - postgres
      - redis
    volumes:
      - ./backend:/app

volumes:
  postgres_data:
  redis_data:

